html, body {
  height: 100%;
  margin: 0;
  text-align:center;
}
header {
  background: url(https://createlivelove.com/mle-files/uploads/LogEngine_Image_1453804954.jpg);
  background-size: cover;
  background-position: center;
  
  /* CENTER TITLE Y */
  display: flex;
  flex-direction: column;
  justify-content: center;
  
  /* CENTER TITLE X */
  align-items: center;
  height: 100vh;
}
.logo {
  width: 180px;
  margin: 20px 0px;
}
h1,h2,p,h4 {
  color: #000;
  padding: 0 20px;
}
h1 {
  font-size: 3em;
  font-family: Lato;
  max-width: 480px;
  text-transform: uppercase;
  margin: 0px;
}
h2 {
  font-size: 1.5em;
  font-family: Merriweather;
  max-width: 500px;
}
h4 {
  font-family: Lato;
  }
p {
  font-family: Lato;
  max-width: 500px;
}
ul {
   list-style-type: none;
   margin: 0;
   padding: 0;
}
li {
  display: inline-block;
}
@media only screen and (max-width:480px) {
  .social-media img {
     height: 50px;
  }
  .logo {
     width: 100px;
     margin: 20px 0px;
  }
  h1 {
     font-size: 2em;
  }
  h2 {
     font-size: 1.2em;
  }
}
@media only screen and (max-width:360px) {
  .logo {
     display:none; 
  }
}
  
</style>
